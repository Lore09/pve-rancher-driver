name: Release

# Triggered by a tag. goreleaser builds the binaries + checksums and creates
# the GitHub release; the NodeDriver CRD is templated at release time so
# users can `kubectl apply -f` a manifest that already carries the right
# version and SHA-256 for the linux/amd64 binary.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Reuse the CI pipeline as a gate; releases cannot ship if lint or tests
  # are red.
  ci:
    needs: []
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: goreleaser release
        run: goreleaser release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser does not know about deploy/nodedriver.yaml; render the
      # CRD's <VERSION> / <SHA256> placeholders against the freshly-built
      # checksums and attach it to the release as a ready-to-apply manifest.
      - name: Render NodeDriver CRD
        id: crd
        shell: bash
        run: |
          set -eu
          VERSION="${GITHUB_REF_NAME}"
          SHA256="$(awk '/docker-machine-driver-pve-linux-amd64$/ {print $1; exit}' dist/checksums.txt)"
          if [ -z "$SHA256" ]; then echo "::error::no linux/amd64 checksum"; exit 1; fi
          mkdir -p dist/rendered
          sed -e "s|<VERSION>|${VERSION}|g" -e "s|<SHA256>|${SHA256}|g" \
            deploy/nodedriver.yaml > dist/rendered/nodedriver-${VERSION}.yaml
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/docker-machine-driver-pve-*
            dist/checksums.txt
            dist/rendered/nodedriver-${{ steps.crd.outputs.version }}.yaml
name: Release

# goreleaser builds the binaries + checksums and creates the GitHub release;
# the NodeDriver CRD is templated at release time so users can
# `kubectl apply -f` a manifest that already carries the right version and
# SHA-256 for the linux/amd64 binary. The Helm chart's checksum is written back
# to the default branch at the end, since the digest cannot be known until the
# binary is built.
#
# Two entry points, both of which pass the tag explicitly:
#   - workflow_call from chart-release.yml, which is the normal path: a chart
#     version bump creates the tag and calls this with `version`.
#   - workflow_dispatch, the escape hatch for re-releasing an existing tag.
#
# There is deliberately no `push: tags` trigger. It could never fire on the
# normal path anyway — a tag pushed with the default GITHUB_TOKEN does not
# start workflow runs — so it was an escape hatch that only worked for someone
# pushing tags with a PAT, while adding a second way for a release to start
# and disagree with what the chart claims to be. The chart version stays the
# single source of truth.
on:
  workflow_call:
    inputs:
      version:
        description: Tag to release, e.g. v0.1.3. Must already exist.
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: Tag to re-release, e.g. v0.1.3. Must already exist.
        required: true
        type: string

permissions:
  contents: write

# A release ends by pushing the checksum commit to the default branch. Two
# releases running at once would race there, and the loser would die on a
# non-fast-forward push — having already published its binaries, leaving a
# release whose chart points at the wrong digest. Queue them instead, and never
# cancel: a half-finished release is worse than a slow one.
concurrency:
  group: release-publish
  cancel-in-progress: false

jobs:
  # Reuse the CI pipeline as a gate; releases cannot ship if lint or tests
  # are red.
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      # goreleaser cross-compiles every target in the next job, so having CI
      # do it first only adds minutes to the release.
      skip-cross-compile: true

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for changelog
          # The default ref is the branch the caller's push landed on, not the
          # new tag. Check the tag out explicitly so goreleaser derives the
          # right version.
          ref: ${{ inputs.version }}

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Install goreleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          install-only: true

      - name: goreleaser release
        run: goreleaser release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # goreleaser v2 `archives.formats: [binary]` writes the binaries into
      # subdirs (dist/docker-machine-driver-pve_<os>_<arch>_vX/docker-machine-driver-pve)
      # and lists the *archive* names (e.g. docker-machine-driver-pve-linux-amd64)
      # in checksums.txt — but never creates those flat archive files at the
      # dist/ top level. softprops/action-gh-release skims the top-level dist/
      # for matching files; subdirs are silently skipped, which is why v0.1.1
      # shipped checksums.txt + nodedriver yaml but no binaries (and the driver
      # sat in `Downloading` forever in Rancher).
      # Flatten the build outputs to match the names in checksums.txt so the
      # upload step below picks them up.
      - name: Flatten goreleaser binary outputs
        shell: bash
        run: |
          set -eu
          echo "==> goreleaser dist/ layout before flatten:"
          find dist -maxdepth 2 -name 'docker-machine-driver-pve*' -print | sort
          for d in dist/docker-machine-driver-pve_*; do
            [ -d "$d" ] || continue
            mid="$(basename "$d")"
            mid="${mid#docker-machine-driver-pve_}"   # linux_amd64_v1 / darwin_arm64_v8.0
            os="${mid%%_*}"
            rest="${mid#*_}"
            arch="${rest%%_*}"
            flat="dist/docker-machine-driver-pve-${os}-${arch}"
            cp "$d/docker-machine-driver-pve" "$flat"
          done
          rm -rf dist/docker-machine-driver-pve_*
          echo "==> dist/ layout after flatten:"
          ls -la dist/

      # goreleaser does not know about deploy/nodedriver.yaml; render the
      # CRD's <VERSION> / <SHA256> placeholders against the freshly-built
      # checksums and attach it to the release as a ready-to-apply manifest.
      - name: Render NodeDriver CRD
        id: crd
        shell: bash
        run: |
          set -eu
          # GITHUB_REF_NAME is the *branch* the chart bump landed on, not the
          # tag, so the tag can only come from the input.
          VERSION="${{ inputs.version }}"
          case "$VERSION" in
            v*) ;;
            *) echo "::error::resolved version '$VERSION' is not a v-prefixed tag"; exit 1 ;;
          esac
          SHA256="$(awk '/docker-machine-driver-pve-linux-amd64$/ {print $1; exit}' dist/checksums.txt)"
          if [ -z "$SHA256" ]; then echo "::error::no linux/amd64 checksum"; exit 1; fi
          mkdir -p dist/rendered
          sed -e "s|<VERSION>|${VERSION}|g" -e "s|<SHA256>|${SHA256}|g" \
            deploy/nodedriver.yaml > dist/rendered/nodedriver-${VERSION}.yaml
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha=${SHA256}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          # Required on the workflow_call path: the run is triggered by a branch
          # push, so the action cannot infer the tag from the ref.
          tag_name: ${{ steps.crd.outputs.version }}
          files: |
            dist/docker-machine-driver-pve-*
            dist/checksums.txt
            dist/rendered/nodedriver-${{ steps.crd.outputs.version }}.yaml

      # The chart pins the binary's SHA-256, which cannot exist until the binary
      # is built — so it is recorded here, after the fact, on the default branch.
      #
      # Until this lands, the chart on the default branch has a checksum
      # belonging to the *previous* version. The chart template detects that
      # mismatch (nodeDriver.checksumFor vs the version being deployed) and
      # refuses to render, so the worst case during this window is a loud error
      # rather than a driver that silently sticks in `Downloading`.
      #
      # This writes values.yaml only. chart-release.yml watches Chart.yaml only.
      # That asymmetry is what makes the loop impossible — keep it.
      - name: Record checksum in chart values
        shell: bash
        env:
          VERSION: ${{ steps.crd.outputs.version }}
          SHA256: ${{ steps.crd.outputs.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          VALUES=deploy/chart/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The build ran against a detached tag; move to the branch that serves
          # the Rancher git-backed repository.
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

          if [ ! -f "$VALUES" ]; then
            echo "::warning::$VALUES not present on $DEFAULT_BRANCH; skipping"; exit 0
          fi

          # Edited with sed rather than `yq -i` on purpose: yq round-trips the
          # document and strips blank lines, reflowing the whole file on every
          # release. sed touches exactly the two lines, so the commit diff stays
          # readable. yq is then used to *verify* the result parsed correctly,
          # which catches a silently non-matching pattern.
          sed -i -E "s|^([[:space:]]*checksum:).*|\1 \"$SHA256\"|" "$VALUES"
          sed -i -E "s|^([[:space:]]*checksumFor:).*|\1 \"$VERSION\"|" "$VALUES"

          GOT_SUM="$(yq -r '.nodeDriver.checksum' "$VALUES")"
          GOT_FOR="$(yq -r '.nodeDriver.checksumFor' "$VALUES")"
          if [ "$GOT_SUM" != "$SHA256" ] || [ "$GOT_FOR" != "$VERSION" ]; then
            echo "::error::failed to write checksum into $VALUES (got sum='$GOT_SUM' for='$GOT_FOR')"; exit 1
          fi

          if git diff --quiet -- "$VALUES"; then
            echo "checksum already current; nothing to commit"; exit 0
          fi

          git add "$VALUES"
          # [skip ci] keeps this from re-running the CI workflow; the path filter
          # in chart-release.yml already prevents a release loop.
          git commit -m "chore(chart): record ${VERSION} binary checksum [skip ci]"
          git push origin "HEAD:$DEFAULT_BRANCH"
name: CI

# The Go pipeline is skipped for changes that cannot affect the Go build —
# currently the Helm chart. GitHub runs the workflow when *any* changed file
# falls outside paths-ignore, so a push touching both the chart and Go code
# still gets linted; only chart-only changes are skipped.
#
# NOTE: paths-ignore does not apply to workflow_call. release.yml invokes this
# workflow as its release gate, so a chart version bump — which reaches this
# workflow through chart-release.yml -> release.yml -> ci.yml — is still fully
# linted and tested before anything is published. Skipping here only affects the
# direct push/PR runs.
on:
  push:
    branches: [master, main]
    tags-ignore: ["v*"]
    paths-ignore:
      - deploy/chart/**
  pull_request:
    branches: [master, main]
    paths-ignore:
      - deploy/chart/**
  workflow_call:
    inputs:
      skip-cross-compile:
        description: >-
          Skip the cross-compile job. Set by release.yml: goreleaser rebuilds
          every target minutes later, so `make dist` there is pure duplicate
          work on the critical path of a release.
        type: boolean
        default: false

# The workflow name is part of the group on purpose.
#
# A release reaches this workflow twice over: once from the push to master, and
# once as the gate release.yml calls. Both runs carry the *same* github.ref
# (refs/heads/master), so a group keyed on the ref alone put them in one bucket
# and cancel-in-progress killed one of them — usually visible as jobs that start
# and immediately go grey, and at worst as a release whose gate was cancelled
# out from under it.
#
# For a reusable workflow, github.workflow is the *calling* workflow's name, so
# the gate run lands in `ci-Chart Release-...` while the push run stays in
# `ci-CI-...`. Superseding still works where it should: a second push to the
# same branch cancels the first.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.59
          # only fail the build if the linter reports issues; left the
          # configuration in .golangci.yml at the repo root.
          args: --timeout=5m

  check:
    name: go vet + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test -race -count=1 ./...
      - name: build (linux/amd64 verification)
        run: go build -o /tmp/docker-machine-driver-pve ./cmd/docker-machine-driver-pve

  build:
    name: Cross-compile
    needs: [lint, check]
    # `inputs` is empty on the push/PR path, and !null is true there — so this
    # runs by default and is skipped only when a caller explicitly opts out.
    # Do not rewrite as `inputs.skip-cross-compile == false`: GitHub coerces
    # both null and false to 0, so that form would skip the job on every push.
    if: ${{ !inputs.skip-cross-compile }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true
      - name: Build all targets + checksums
        run: make dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14
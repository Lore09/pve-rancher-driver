name: CI

# Pull requests only. Merges cannot happen without a green pull request, so
# re-running the same commits afterwards proves nothing.
#
# CHECK TIERS
# -----------
# PR -> dev    lint, vet, tests   (fast feedback on feature work)
# PR -> master the above + govulncheck + cross-compile
#
# NOTE: there is no `paths-ignore` here. GitHub reports a skipped workflow's
# checks as *missing* rather than passing, so filtering out chart-only pull
# requests would leave them permanently unmergeable against the required checks
# configured on master. Do not add one back.
on:
  pull_request:
    branches: [master, dev]

# A new push to the same pull request cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides whether the Go pipeline has anything to do. The jobs below always
  # run so their required status checks always report; they just skip their
  # steps when nothing relevant changed.
  changes:
    name: Detect relevant changes
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        shell: bash
        run: |
          set -euo pipefail

          # Safety net: anything that is not a pull request runs in full.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; exit 0
          fi

          git fetch -q origin "${{ github.base_ref }}"
          BASE="$(git merge-base HEAD "origin/${{ github.base_ref }}")"
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "$CHANGED"

          if printf '%s\n' "$CHANGED" | grep -Eq '\.go$|^go\.(mod|sum)$|^\.golangci\.yml$|^Makefile$|^\.goreleaser\.yaml$|^\.github/(workflows/(ci|release)\.yml|scripts/)'; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: Lint (golangci-lint)
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.go == 'true' }}
      - uses: actions/setup-go@v5
        if: ${{ needs.changes.outputs.go == 'true' }}
        with:
          go-version: "1.25"
          cache: true
      # golangci-lint v2 + action v8. v1 cannot parse a `go 1.25.0` directive
      # and is no longer released, so the Go toolchain bump forced this. The
      # config in .golangci.yml at the repo root was migrated to the v2 schema
      # at the same time; the linter set is unchanged.
      #
      # No `args:` — v2 reads the timeout from `run.timeout` in the config.
      - uses: golangci/golangci-lint-action@v8
        if: ${{ needs.changes.outputs.go == 'true' }}
        with:
          version: v2.6.2

  check:
    name: go vet + tests
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.go == 'true' }}
      - uses: actions/setup-go@v5
        if: ${{ needs.changes.outputs.go == 'true' }}
        with:
          go-version: "1.25"
          cache: true
      - name: go vet
        if: ${{ needs.changes.outputs.go == 'true' }}
        run: go vet ./...
      - name: go test
        if: ${{ needs.changes.outputs.go == 'true' }}
        run: go test -race -count=1 ./...
      - name: build (linux/amd64 verification)
        if: ${{ needs.changes.outputs.go == 'true' }}
        run: go build -o /tmp/docker-machine-driver-pve ./cmd/docker-machine-driver-pve

  vuln:
    name: govulncheck
    needs: changes
    # Master-tier only.
    if: ${{ github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.go == 'true' }}
      - uses: actions/setup-go@v5
        if: ${{ needs.changes.outputs.go == 'true' }}
        with:
          go-version: "1.25"
          cache: true
      # Pinned, not @latest: a release must not start failing because an
      # upstream tool changed under it. v1.1.4 rather than v1.1.3 — the latter's
      # x/tools dependency does not compile on Go 1.24+, so it would break for
      # anyone running this locally against a modern toolchain.
      - name: Install govulncheck
        if: ${{ needs.changes.outputs.go == 'true' }}
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
      # Reports only vulnerabilities in code paths this module actually reaches,
      # so a finding here is real rather than a transitive-dependency rumour.
      #
      # The gate script decides pass/fail rather than govulncheck's own exit
      # code, because this module has 11 unfixable findings in a deliberately
      # pinned docker/docker. See .github/scripts/govulncheck-gate.sh for the
      # allowlist and the reasoning. `|| true` keeps a non-zero govulncheck
      # exit (which it returns whenever it finds anything at all) from ending
      # the step before the gate has looked at the results.
      - name: Run govulncheck
        if: ${{ needs.changes.outputs.go == 'true' }}
        run: govulncheck -format json ./... > govulncheck.json || true

      - name: Gate on non-allowlisted findings
        if: ${{ needs.changes.outputs.go == 'true' }}
        run: bash .github/scripts/govulncheck-gate.sh govulncheck.json

  build:
    name: Cross-compile
    needs: [changes, lint, check]
    # Master-tier only.
    if: ${{ github.base_ref == 'master' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.changes.outputs.go == 'true' }}
      - uses: actions/setup-go@v5
        if: ${{ needs.changes.outputs.go == 'true' }}
        with:
          go-version: "1.25"
          cache: true
      - name: Build all targets + checksums
        if: ${{ needs.changes.outputs.go == 'true' }}
        run: make dist
      - uses: actions/upload-artifact@v4
        if: ${{ needs.changes.outputs.go == 'true' }}
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 14

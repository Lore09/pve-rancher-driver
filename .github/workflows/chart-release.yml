name: Chart Release

# Chart version bumps drive releases.
#
# Bumping `version` in deploy/chart/Chart.yaml is the single action that cuts a
# release: this workflow notices the change, creates the matching tag, and
# invokes the release workflow to build and publish the binaries. There is no
# separate `git tag` step to remember, and no way to tag a version the chart
# does not claim to be.
#
# The branch decides what kind of release it is:
#   dev    -> v<version>-dev, published as a GitHub prerelease
#   master -> v<version>,      published as the stable release
# The -dev suffix lives only in the tag. deploy/chart/Chart.yaml always carries
# a plain x.y.z version, so dev and master never differ on that file.
#
# WHY THE PATH FILTER IS EXACTLY ONE FILE
# ---------------------------------------
# release.yml writes the freshly-built binary's SHA-256 back into
# deploy/chart/values.yaml, because the digest cannot exist before the binary
# does. Watching only Chart.yaml means that write can never re-trigger this
# workflow. Do NOT broaden this filter to `deploy/chart/**` — that creates an
# infinite release loop.
on:
  push:
    branches: [master, dev]
    paths:
      - deploy/chart/Chart.yaml

# Serialise releases so two quick bumps cannot race to create tags. The group is
# deliberately branch-independent: a dev and a master release both create tags
# and both end up publishing, so they must not overlap either. Never cancel in
# progress: a half-finished release leaves a tag with no binaries.
concurrency:
  group: chart-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  detect:
    name: Detect chart version bump
    runs-on: ubuntu-latest
    outputs:
      bumped: ${{ steps.check.outputs.bumped }}
      tag: ${{ steps.check.outputs.tag }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # needs history to diff against the pre-push commit
          fetch-tags: true # detect-release.sh needs the full tag list

      # Read the two versions and the previous tip's version out of git, then
      # hand the decision to the script. The split exists so the decision logic
      # is unit-testable without a repository; see
      # .github/scripts/detect-release.test.sh.
      - name: Gather versions
        id: gather
        shell: bash
        run: |
          set -euo pipefail
          CHART=deploy/chart/Chart.yaml

          {
            echo "new=$(yq -r '.version' "$CHART")"
            echo "app=$(yq -r '.appVersion' "$CHART")"
          } >> "$GITHUB_OUTPUT"

          # github.event.before is the tip before this push, which handles a
          # push containing several commits. It is all-zeros when the branch was
          # just created, in which case treat the chart as new.
          BEFORE="${{ github.event.before }}"
          OLD=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            OLD="$(git show "$BEFORE:$CHART" 2>/dev/null | yq -r '.version' 2>/dev/null || true)"
          fi
          echo "old=$OLD" >> "$GITHUB_OUTPUT"

      - name: Decide release
        id: check
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
          NEW_VERSION: ${{ steps.gather.outputs.new }}
          APP_VERSION: ${{ steps.gather.outputs.app }}
          OLD_VERSION: ${{ steps.gather.outputs.old }}
        run: |
          set -euo pipefail
          EXISTING_TAGS="$(git tag --list)" \
            bash .github/scripts/detect-release.sh

      - name: Create and push tag
        if: steps.check.outputs.bumped == 'true'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.check.outputs.tag }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG (chart version bump)"
          git push origin "refs/tags/$TAG"
          echo "::notice::created tag $TAG"

  # Invoke the release workflow directly rather than relying on the tag push to
  # trigger it. A tag pushed using the default GITHUB_TOKEN does NOT start new
  # workflow runs, so the tag-triggered path in release.yml would silently never
  # fire here. Calling it explicitly avoids needing a PAT.
  release:
    name: Release
    needs: detect
    if: needs.detect.outputs.bumped == 'true'
    uses: ./.github/workflows/release.yml
    with:
      version: ${{ needs.detect.outputs.tag }}
      prerelease: ${{ needs.detect.outputs.prerelease == 'true' }}
    permissions:
      contents: write
    secrets: inherit
